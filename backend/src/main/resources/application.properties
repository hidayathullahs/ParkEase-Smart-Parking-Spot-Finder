# Server Configuration
server.port=${PORT:5002}
server.address=0.0.0.0

# MongoDB Atlas Configuration (Required: Set MONGODB_URI in Render)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Security Configuration (Required: Set JWT_SECRET in Render)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Seeding Configuration (Disabled by default in production)
app.seed.enabled=${APP_SEED_ENABLED:false}

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:*,http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Production Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.parkease=INFO
