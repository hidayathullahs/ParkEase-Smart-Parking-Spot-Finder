# Server Configuration
server.port=${PORT:5002}
server.address=0.0.0.0

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/parkease_db}
spring.data.mongodb.auto-index-creation=true

# Security Configuration
jwt.secret=${JWT_SECRET:parkease_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security}
jwt.expiration=${JWT_EXPIRATION:86400000}
# 24 hours in milliseconds

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:*,http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Production Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.parkease=INFO
