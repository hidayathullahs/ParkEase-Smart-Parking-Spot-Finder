# yaml-language-server: $schema=https://json.schemastore.org/render.yaml
services:
  # 1. Spring Boot Backend (Docker Web Service)
  - type: web
    name: parkease-backend
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SEED_ENABLED
        value: "false"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: parkease-frontend
          property: host
      - key: GOOGLE_CLIENT_ID
        sync: false

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: parkease-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: parkease-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
